<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة مكاتب التوظيف حسب الفرع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c;
    --panel:#1b1f27;
    --panel-2:#20242e;
    --border:#2a2f3a;
    --text:#eceef2;
    --text-dim:#98a1b2;
    --accent:#e8a93d;
    --accent-2:#4fa3d6;
    --good:#56c596;
    --bad:#e5637a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(232,169,61,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(79,163,214,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding:28px 24px 60px;
  }
  .heading{font-family:'IBM Plex Sans Arabic',sans-serif;}
  .num{font-family:'IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums;}

  /* ===== top bar ===== */
  .topbar{
    max-width:1320px;margin:0 auto 20px;
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  }
  .titleblock{display:flex;align-items:center;gap:12px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(86,197,150,0.18);flex:none;}
  .dot.err{background:var(--bad);box-shadow:0 0 0 4px rgba(229,99,122,0.18);}
  .dot.loading{background:var(--accent);box-shadow:0 0 0 4px rgba(232,169,61,0.18);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  h1{font-size:22px;margin:0;font-weight:700;}
  .subline{color:var(--text-dim);font-size:13px;margin-top:2px;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:13.5px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    padding:9px 16px;border-radius:9px;cursor:pointer;transition:border-color .15s, transform .05s;
  }
  button:hover{border-color:var(--accent);}
  button:active{transform:scale(0.97);}
  button.primary{background:var(--accent);color:#1a1608;border-color:var(--accent);}
  button.toggle-on{border-color:var(--good);color:var(--good);}
  button.toggle-off{color:var(--text-dim);}
  button:disabled{opacity:.5;cursor:default;}

  /* ===== kpi strip ===== */
  .kpis{
    max-width:1320px;margin:0 auto 18px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  }
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;
  }
  .kpi .label{color:var(--text-dim);font-size:12.5px;margin-bottom:8px;}
  .kpi .value{font-size:28px;font-weight:700;}
  .kpi .value.small{font-size:16px;}

  /* ===== filter bar ===== */
  .filterbar{
    max-width:1320px;margin:0 auto 22px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  }
  .filterbar input[type="text"], .filterbar select{
    font-family:'Tajawal',sans-serif;font-size:13.5px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:8px;min-width:160px;
  }
  .filterbar label{font-size:12.5px;color:var(--text-dim);display:flex;flex-direction:column;gap:5px;}
  .filterbar .grow{flex:1;min-width:220px;}
  .filterbar .grow input{width:100%;}
  .clear-link{color:var(--accent-2);font-size:12.5px;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;}

  /* ===== leaderboard ===== */
  .section-title{max-width:1320px;margin:0 auto 10px;font-size:15px;font-weight:700;color:var(--text-dim);}
  .leaderboard{
    max-width:1320px;margin:0 auto 26px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;
  }
  .lb-row{display:flex;align-items:center;gap:12px;padding:6px 0;}
  .lb-name{width:170px;flex:none;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-track{flex:1;background:var(--panel-2);border-radius:6px;height:16px;overflow:hidden;}
  .lb-fill{height:100%;border-radius:6px;}
  .lb-count{width:38px;flex:none;text-align:left;font-weight:700;font-size:13.5px;}

  /* ===== branch grid ===== */
  .grid{
    max-width:1320px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
  }
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:12px;
    border-top:3px solid var(--accent-card, var(--accent));
  }
  .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card-head .hub{font-weight:700;font-size:15px;}
  .card-head .total{font-size:20px;font-weight:700;color:var(--accent-card,var(--accent));}
  .office-row{display:flex;align-items:center;gap:10px;}
  .office-name{width:120px;flex:none;font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .office-track{flex:1;background:var(--panel-2);border-radius:5px;height:10px;overflow:hidden;}
  .office-fill{height:100%;border-radius:5px;background:var(--accent-card,var(--accent));opacity:.85;}
  .office-count{width:26px;flex:none;text-align:left;font-size:12.5px;font-weight:700;}

  .empty, .errbox, .loadingbox{
    max-width:640px;margin:60px auto;text-align:center;color:var(--text-dim);
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px 26px;
  }
  .errbox{color:var(--bad);}
  .errbox .hint{color:var(--text-dim);font-size:13px;margin-top:10px;line-height:1.9;}
  .footnote{max-width:1320px;margin:26px auto 0;color:var(--text-dim);font-size:12px;line-height:1.8;}
</style>
</head>
<body>

<div class="topbar">
  <div class="titleblock">
    <span class="dot" id="statusDot"></span>
    <div>
      <h1 class="heading">لوحة مكاتب التوظيف حسب الفرع</h1>
      <div class="subline" id="syncLine">جارِ الاتصال بالشيت...</div>
    </div>
  </div>
  <div class="controls">
    <button id="refreshBtn">تحديث الآن</button>
    <button id="autoBtn" class="toggle-on">تحديث تلقائي: تشغيل</button>
  </div>
</div>

<div class="kpis">
  <div class="kpi"><div class="label">إجمالي المناديب (فريد)</div><div class="value num" id="kpiTotal">—</div></div>
  <div class="kpi"><div class="label">عدد الفروع</div><div class="value num" id="kpiBranches">—</div></div>
  <div class="kpi"><div class="label">عدد المكاتب</div><div class="value num" id="kpiOffices">—</div></div>
  <div class="kpi"><div class="label">أكبر فرع</div><div class="value small" id="kpiTopBranch">—</div></div>
</div>

<div class="filterbar">
  <label class="grow">بحث بالفرع أو المكتب
    <input type="text" id="searchInput" placeholder="مثال: Helwan أو Smart">
  </label>
  <label>اليوم
    <select id="dayFilter"><option value="all">كل الأيام</option></select>
  </label>
  <label>حالة المندوب
    <select id="statusFilter">
      <option value="all">الكل</option>
      <option value="New Star">نجوم جدد فقط</option>
      <option value="Reactivate">إعادة تفعيل فقط</option>
    </select>
  </label>
  <button class="clear-link" id="clearBtn">مسح الفلاتر</button>
</div>

<div id="content">
  <div class="loadingbox" id="loadingBox">جارِ تحميل بيانات الشيت لأول مرة...</div>
</div>

<div class="footnote" id="footnote"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const SHEET_ID = "1nOI6ZUJS_mQDUw-jJRhyx-vIaDmDkPe1oGUjNt5CYrU";
const SHEET_NAME = "Sheet1";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_ts=`;
const REFRESH_MS = 45000;

const palette = ['#e8a93d','#4fa3d6','#8b7fd9','#56c596','#e5637a','#d98c4f','#5fd0d0','#c8a2ec'];

let rawRows = [];      // parsed data rows as objects
let dayOptionsBuilt = false;
let autoRefresh = true;
let timer = null;

const el = id => document.getElementById(id);

function setStatus(state, message){
  const dot = el('statusDot');
  dot.className = 'dot' + (state === 'error' ? ' err' : state === 'loading' ? ' loading' : '');
  el('syncLine').textContent = message;
}

function timeAgoLabel(date){
  const s = Math.floor((Date.now() - date.getTime())/1000);
  if (s < 5) return 'الآن';
  if (s < 60) return `قبل ${s} ثانية`;
  const m = Math.floor(s/60);
  return `قبل ${m} دقيقة`;
}

let lastSyncAt = null;
setInterval(() => {
  if (lastSyncAt) setStatus('ok', `متصل • آخر تحديث: ${timeAgoLabel(lastSyncAt)}`);
}, 5000);

async function fetchSheet(){
  setStatus('loading', 'جارِ التحديث من الشيت...');
  el('refreshBtn').disabled = true;
  try{
    const res = await fetch(CSV_URL + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text.trim(), {skipEmptyLines:false});
    processRows(parsed.data);
    lastSyncAt = new Date();
    setStatus('ok', `متصل • آخر تحديث: ${timeAgoLabel(lastSyncAt)}`);
    render();
  }catch(err){
    console.error(err);
    setStatus('error', 'تعذّر الاتصال بالشيت');
    renderError();
  }finally{
    el('refreshBtn').disabled = false;
  }
}

function processRows(matrix){
  // locate the real header row (contains both "Hub" and "contractor")
  let headerIdx = -1;
  for(let i=0;i<matrix.length;i++){
    const row = matrix[i].map(c => (c||'').trim());
    if(row.includes('Hub') && row.includes('contractor')){
      headerIdx = i; break;
    }
  }
  if(headerIdx === -1){ rawRows = []; return; }

  const header = matrix[headerIdx].map(c => (c||'').trim());
  const idx = {
    date: header.indexOf('Date'),
    starId: header.indexOf('Star Id'),
    fullName: header.indexOf('Full Name'),
    hub: header.indexOf('Hub'),
    contractor: header.indexOf('contractor'),
    status: header.indexOf('status of star'),
  };

  const out = [];
  for(let i=headerIdx+1; i<matrix.length; i++){
    const r = matrix[i];
    if(!r || r.length < 2) continue;
    const hub = (r[idx.hub]||'').trim();
    const contractor = (r[idx.contractor]||'').trim();
    const starId = (r[idx.starId]||'').trim();
    if(!hub || !contractor || !starId) continue;
    out.push({
      date: (r[idx.date]||'').trim(),
      starId,
      fullName: (r[idx.fullName]||'').trim(),
      hub,
      contractor,
      status: (r[idx.status]||'').trim(),
    });
  }
  rawRows = out;
  buildDayOptions();
}

function buildDayOptions(){
  const select = el('dayFilter');
  const current = select.value;
  const seen = new Set();
  const days = [];
  rawRows.forEach(r => { if(r.date && !seen.has(r.date)){ seen.add(r.date); days.push(r.date); } });
  select.innerHTML = '<option value="all">كل الأيام</option>' +
    days.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
  if(days.includes(current)) select.value = current;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getFilteredRows(){
  const day = el('dayFilter').value;
  const status = el('statusFilter').value;
  const search = el('searchInput').value.trim().toLowerCase();
  return rawRows.filter(r => {
    if(day !== 'all' && r.date !== day) return false;
    if(status !== 'all' && r.status !== status) return false;
    if(search && !(r.hub.toLowerCase().includes(search) || r.contractor.toLowerCase().includes(search))) return false;
    return true;
  });
}

function aggregate(rows){
  const byHub = new Map(); // hub -> Map(office -> Set(starId))
  const officeTotals = new Map(); // office -> Set(starId) across all hubs (filtered)
  rows.forEach(r => {
    if(!byHub.has(r.hub)) byHub.set(r.hub, new Map());
    const hubMap = byHub.get(r.hub);
    if(!hubMap.has(r.contractor)) hubMap.set(r.contractor, new Set());
    hubMap.get(r.contractor).add(r.starId);

    if(!officeTotals.has(r.contractor)) officeTotals.set(r.contractor, new Set());
    officeTotals.get(r.contractor).add(r.starId);
  });
  return {byHub, officeTotals};
}

function render(){
  const filtered = getFilteredRows();
  const {byHub, officeTotals} = aggregate(filtered);

  // KPIs
  const uniqueStars = new Set(filtered.map(r => r.starId));
  el('kpiTotal').textContent = uniqueStars.size.toLocaleString('en');
  el('kpiBranches').textContent = byHub.size.toLocaleString('en');
  el('kpiOffices').textContent = officeTotals.size.toLocaleString('en');

  let topBranchName = '—', topBranchCount = -1;
  byHub.forEach((offMap, hub) => {
    const total = [...offMap.values()].reduce((sum, set) => sum + set.size, 0);
    if(total > topBranchCount){ topBranchCount = total; topBranchName = hub; }
  });
  el('kpiTopBranch').textContent = topBranchCount >= 0 ? `${topBranchName} (${topBranchCount})` : '—';

  const content = el('content');
  content.innerHTML = '';

  if(byHub.size === 0){
    content.innerHTML = '<div class="empty">لا توجد بيانات مطابقة للفلاتر الحالية.</div>';
    el('footnote').textContent = '';
    return;
  }

  // Leaderboard (overall offices)
  const lbEntries = [...officeTotals.entries()]
    .map(([office, set]) => [office, set.size])
    .sort((a,b) => b[1]-a[1])
    .slice(0, 10);
  const lbMax = lbEntries.length ? lbEntries[0][1] : 1;

  const lbWrap = document.createElement('div');
  lbWrap.innerHTML = `<div class="section-title heading">أفضل ١٠ مكاتب توظيف (كل الفروع)</div>`;
  const lb = document.createElement('div');
  lb.className = 'leaderboard';
  lbEntries.forEach(([office, count], i) => {
    const color = palette[i % palette.length];
    const row = document.createElement('div');
    row.className = 'lb-row';
    row.innerHTML = `
      <div class="lb-name">${escapeHtml(office)}</div>
      <div class="lb-track"><div class="lb-fill" style="width:${(count/lbMax*100).toFixed(1)}%; background:${color};"></div></div>
      <div class="lb-count num">${count}</div>`;
    lb.appendChild(row);
  });
  lbWrap.appendChild(lb);
  content.appendChild(lbWrap);

  // Branch cards
  const branchesTitle = document.createElement('div');
  branchesTitle.className = 'section-title heading';
  branchesTitle.textContent = 'تفاصيل كل فرع حسب المكتب';
  content.appendChild(branchesTitle);

  const grid = document.createElement('div');
  grid.className = 'grid';

  const hubEntries = [...byHub.entries()].map(([hub, offMap]) => {
    const total = [...offMap.values()].reduce((s, set) => s + set.size, 0);
    const offices = [...offMap.entries()]
      .map(([office, set]) => [office, set.size])
      .sort((a,b) => b[1]-a[1]);
    return {hub, total, offices};
  }).sort((a,b) => b.total - a.total);

  hubEntries.forEach((entry, i) => {
    const color = palette[i % palette.length];
    const maxOffice = entry.offices[0] ? entry.offices[0][1] : 1;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--accent-card', color);
    card.innerHTML = `
      <div class="card-head">
        <div class="hub">${escapeHtml(entry.hub)}</div>
        <div class="total num">${entry.total}</div>
      </div>
    `;
    entry.offices.forEach(([office, count]) => {
      const row = document.createElement('div');
      row.className = 'office-row';
      row.innerHTML = `
        <div class="office-name">${escapeHtml(office)}</div>
        <div class="office-track"><div class="office-fill" style="width:${(count/maxOffice*100).toFixed(1)}%"></div></div>
        <div class="office-count num">${count}</div>`;
      card.appendChild(row);
    });
    grid.appendChild(card);
  });

  content.appendChild(grid);

  el('footnote').textContent =
    `العدّ يعتمد على عدد المناديب الفريدين (Star Id) لكل مكتب داخل كل فرع، بحسب الفلاتر الحالية. المصدر: الشيت المباشر على Google Sheets.`;
}

function renderError(){
  el('content').innerHTML = `
    <div class="errbox">
      تعذّر تحميل بيانات الشيت.
      <div class="hint">
        تأكد أن مشاركة الشيت مضبوطة على "أي شخص لديه الرابط – عرض فقط"، ثم اضغط "تحديث الآن".
        إذا استمرت المشكلة، افتح الشيت من المتصفح للتأكد من صلاحية الرابط.
      </div>
    </div>`;
}

function scheduleAuto(){
  if(timer) clearInterval(timer);
  if(autoRefresh) timer = setInterval(fetchSheet, REFRESH_MS);
}

el('refreshBtn').addEventListener('click', fetchSheet);
el('autoBtn').addEventListener('click', () => {
  autoRefresh = !autoRefresh;
  el('autoBtn').textContent = 'تحديث تلقائي: ' + (autoRefresh ? 'تشغيل' : 'إيقاف');
  el('autoBtn').className = autoRefresh ? 'toggle-on' : 'toggle-off';
  scheduleAuto();
});
el('searchInput').addEventListener('input', render);
el('dayFilter').addEventListener('change', render);
el('statusFilter').addEventListener('change', render);
el('clearBtn').addEventListener('click', () => {
  el('searchInput').value = '';
  el('dayFilter').value = 'all';
  el('statusFilter').value = 'all';
  render();
});

fetchSheet();
scheduleAuto();
</script>
</body>
</html>
